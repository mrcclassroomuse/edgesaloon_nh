<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Book Now | The Edge Salon</title>
   <style>
       :root {
           --primary: #008080;
           --accent: #00bcd4; /* Gold accent */
           --light: #f4f4f4;
       }


       body {
           font-family: 'Segoe UI', sans-serif;
           margin: 0;
           background-color: var(--light);
           color: var(--primary);
       }


       nav {
           background: var(--primary);
           padding: 1rem;
           text-align: center;
       }


       nav a {
           color: white;
           text-decoration: none;
           margin: 0 15px;
           text-transform: uppercase;
           font-size: 0.9rem;
       }


       .booking-container {
           max-width: 800px;
           margin: 40px auto;
           background: white;
           padding: 30px;
           border-radius: 12px;
           box-shadow: 0 10px 30px rgba(0,0,0,0.1);
       }


       h1 { text-align: center; color: var(--primary); }


       .form-group { margin-bottom: 20px; }


       label { display: block; margin-bottom: 8px; font-weight: bold; }


       input, select, textarea {
           width: 100%;
           padding: 12px;
           border: 1px solid #ddd;
           border-radius: 6px;
           box-sizing: border-box; /* Essential for responsiveness */
       }


       .btn-submit {
           background: var(--primary);
           color: white;
           padding: 15px;
           border: none;
           width: 100%;
           border-radius: 6px;
           cursor: pointer;
           font-size: 1.1rem;
           transition: 0.3s;
       }


       .btn-submit:hover { background: var(--accent); }


       @media (max-width: 600px) {
           .booking-container { margin: 10px; padding: 20px; }
       }
   </style>
</head>
<body>


   <nav>
       <nav><a href="index.html">Home</a> <a href="services.html">Services</a> <a href="policies.html">Policies</a> <a href="shop.html">Shop</a></nav>
    
      
   </nav>


   <div class="booking-container">
       <h1>Reserve Your Style</h1>
       <p style="text-align: center;">Experience the edge of modern hair artistry.</p>
      
       <form action="#" method="POST">
           <div class="form-group">
               <label>Full Name</label>
               <input type="text" placeholder="Your Name" required>
           </div>


           <div class="form-group">
               <label>Select Service</label>
               <select required>
                   <option value="">Choose a treatment...</option>
                   <option value="cut">Master Precision Cut ($85)</option>
                   <option value="blowout">Signature Blowout ($55)</option>
                   <option value="balayage">Full Balayage & Gloss ($210+)</option>
                   <option value="keratin">Keratin Smoothing ($250)</option>
               </select>
           </div>


           <div class="form-group">
               <label>Preferred Date</label>
               <input type="date" required>
           </div>


           <div class="form-group">
               <label>Additional Notes</label>
               <textarea rows="4" placeholder="Any special requests?"></textarea>
           </div>


           <button type="submit" class="btn-submit">Confirm Request</button>
       </form>
   </div>


</body>
</html>
